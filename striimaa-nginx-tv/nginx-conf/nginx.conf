#user  nobody;
worker_processes  1;
#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # Enable HLS output
            hls on;
            hls_path /dev/shm/tv/hls;
            hls_fragment 4;
            hls_playlist_length 20;

            # optional cleanup
            hls_cleanup on;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    live_zone zone=foo:10m;
    live_zone zone=mp3:1024k;
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       8000;
        server_name  localhost;
        root /www;
        location / {
        #    root   /www;
            index  index.html index.py;
        }

location ~ \.(cgi|pl|py)$ {
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    fastcgi_pass unix:/var/run/fcgiwrap.socket;
}
    location /decosilta/ {
        proxy_pass http://127.0.0.1:7051/;

        proxy_http_version 1.1;

        # websocket-tuki (tarvitaan socket.io:lle)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

location /tileraiteet/tiles/ {

    add_header Access-Control-Allow-Origin * always;

    add_header Content-Encoding gzip always;

    default_type application/x-protobuf;

}

#    location ~ \.pbf$ {
#        add_header Access-Control-Allow-Origin * always;
#        types {
#            application/x-protobuf pbf;
#        }
#        gzip off;
#    }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /dev/shm/tv;
            add_header Cache-Control no-cache;

            # CORS (important for web players)
            add_header Access-Control-Allow-Origin *;
        }

        location ~ ^/pub/(?<name>[a-zA-Z0-9._-]+)$ { #transport stream input
            allow 127.0.0.1;
            allow 192.168.0.0/24;
	    deny all;
            live foo;
            live_key $name;
            live_methods POST;
            client_max_body_size 0;
        }


        location ~ ^/stream/(?<name>[a-zA-Z0-9._-]+)$ { #transport stream output
            live foo;
            live_key $name;
            live_methods GET;
            client_max_body_size 0; # tartteeko tässä edes?
        }

        location /publish/ { #hls ja dash
            ts;
            ts_hls path=/dev/shm/hls segment=10s;
            ts_dash path=/dev/shm/dash segment=10s;

            client_max_body_size 0;
        }

        location /play/ { #hls ja dash
            types {
                application/x-mpegURL m3u8;
                application/dash+xml mpd;
                video/MP2T ts;
                video/mp4 mp4;
            }
            alias /dev/shm/;
        }
        location /radio {
            proxy_pass http://192.168.0.26:5000/;
        }

location /pisocket.io/ {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    proxy_pass http://192.168.0.26:5000/pisocket.io/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}


